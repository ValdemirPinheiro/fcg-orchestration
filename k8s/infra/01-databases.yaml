# =============================================================================
# Infraestrutura de dados: PostgreSQL (x2), MongoDB e Redis
# Todos com Deployment (nunca Pods isolados) + Service + Secret
# =============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: fcg
type: Opaque
stringData:
  POSTGRES_USER: fcg
  POSTGRES_PASSWORD: fcg123
---
# --------------------------------------------------------- PostgreSQL Users --
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-users-config
  namespace: fcg
data:
  POSTGRES_DB: fcg_users
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-users
  namespace: fcg
  labels:
    app: postgres-users
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-users
  template:
    metadata:
      labels:
        app: postgres-users
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-users-config
            - secretRef:
                name: db-credentials
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits:   { memory: "512Mi", cpu: "500m" }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fcg"]
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-users
  namespace: fcg
spec:
  type: ClusterIP
  selector:
    app: postgres-users
  ports:
    - port: 5432
      targetPort: 5432
---
# ------------------------------------------------------- PostgreSQL Catalog --
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-catalog-config
  namespace: fcg
data:
  POSTGRES_DB: fcg_catalog
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-catalog
  namespace: fcg
  labels:
    app: postgres-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-catalog
  template:
    metadata:
      labels:
        app: postgres-catalog
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-catalog-config
            - secretRef:
                name: db-credentials
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits:   { memory: "512Mi", cpu: "500m" }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fcg"]
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-catalog
  namespace: fcg
spec:
  type: ClusterIP
  selector:
    app: postgres-catalog
  ports:
    - port: 5432
      targetPort: 5432
---
# -------------------------------------------------------------- MongoDB -----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: fcg
  labels:
    app: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits:   { memory: "768Mi", cpu: "500m" }
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: fcg
spec:
  type: ClusterIP
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
---
# ---------------------------------------------------------------- Redis -----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fcg
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits:   { memory: "256Mi", cpu: "300m" }
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fcg
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
