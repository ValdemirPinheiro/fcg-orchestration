# =============================================================================
# Kong API Gateway (DB-less) — ponto de entrada ÚNICO do sistema FCG
# A configuração declarativa (rotas + plugin JWT) vive em um ConfigMap.
# =============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: kong-jwt-secret
  namespace: fcg
type: Opaque
stringData:
  # Mesma chave HMAC usada pelo UsersAPI para assinar os tokens
  jwt-secret: "fcg-fase3-chave-secreta-compartilhada-entre-servicos-e-kong-1234567890"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
  namespace: fcg
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true

    services:
      - name: users-api
        url: http://users-api:80
        retries: 3
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: users-auth-public
            paths: [/api/auth]
            strip_path: false
            methods: [POST, OPTIONS]
          - name: users-admin-protected
            paths: [/api/users]
            strip_path: false
            plugins:
              - name: jwt
                config:
                  claims_to_verify: [exp]
                  key_claim_name: iss
                  secret_is_base64: false

      - name: catalog-api
        url: http://catalog-api:80
        retries: 3
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: catalog-public
            paths: [/api/games]
            strip_path: false
            methods: [GET, OPTIONS]
            regex_priority: 100
          - name: catalog-protected
            paths: [/api/games]
            strip_path: false
            methods: [POST, PUT, DELETE, PATCH]
            regex_priority: 50
            plugins:
              - name: jwt
                config:
                  claims_to_verify: [exp]
                  key_claim_name: iss
                  secret_is_base64: false
          - name: catalog-library-protected
            paths: [/api/library]
            strip_path: false
            plugins:
              - name: jwt
                config:
                  claims_to_verify: [exp]
                  key_claim_name: iss
                  secret_is_base64: false

    consumers:
      - username: fcg-platform
        jwt_secrets:
          - key: FCG.Gateway
            algorithm: HS256
            secret: fcg-fase3-chave-secreta-compartilhada-entre-servicos-e-kong-1234567890

    plugins:
      - name: prometheus
        config:
          status_code_metrics: true
          latency_metrics: true
          upstream_health_metrics: true
          bandwidth_metrics: true
      - name: rate-limiting
        config:
          minute: 120
          policy: local
          fault_tolerant: true
      - name: cors
        config:
          origins: ["*"]
          methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
          headers: [Accept, Authorization, Content-Type, Origin]
          credentials: true
          max_age: 3600
      - name: correlation-id
        config:
          header_name: X-Correlation-ID
          generator: uuid
          echo_downstream: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: fcg
  labels:
    app: kong
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: kong
          image: kong:3.7
          ports:
            - name: proxy
              containerPort: 8000
            - name: admin
              containerPort: 8001
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/kong.yml
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_LISTEN
              value: 0.0.0.0:8001
            - name: KONG_PLUGINS
              value: bundled
          volumeMounts:
            - name: kong-config
              mountPath: /kong
              readOnly: true
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits:   { memory: "512Mi", cpu: "500m" }
          readinessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: kong-config
          configMap:
            name: kong-declarative-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: fcg
  labels:
    app: kong
spec:
  # NodePort expõe o Gateway para fora do cluster — porta de entrada única
  type: NodePort
  selector:
    app: kong
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
      nodePort: 30000
---
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  namespace: fcg
  labels:
    app: kong
spec:
  type: ClusterIP
  selector:
    app: kong
  ports:
    - name: admin
      port: 8001
      targetPort: 8001
